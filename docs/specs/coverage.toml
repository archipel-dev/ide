# - `status` is `implemented` or `partial`; a requirement that is not listed and not referenced
#   from code is `missing`.
# - `implemented` means the requirement text and its acceptance criterion are met and a test
#   exercises that behaviour. Anything weaker, or any known deviation from the spec, is `partial`
#   with the gap named in `note`. When in doubt, `partial`.
# - Every entry names at least one `code` path and one `test` path; the tool verifies that they
#   exist. `ids` may use ranges (`PLAT-SCOPE-010..012`) that expand to the defined IDs.
# - Each ID may appear in one entry only.

