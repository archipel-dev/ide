<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#22345C"/>
      <stop offset="1" stop-color="#0D1526"/>
    </linearGradient>
    <linearGradient id="mark" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFB547"/>
      <stop offset="1" stop-color="#FF7A1A"/>
    </linearGradient>
  </defs>
  <rect x="64" y="64" width="896" height="896" rx="208" fill="url(#bg)"/>
  <!-- Exhaust trail: three streaks behind the mark. -->
  <g transform="translate(36 0)">
  <g stroke="#3FD0C2" stroke-width="36" stroke-linecap="round">
    <line x1="214" y1="330" x2="340" y2="330"/>
    <line x1="174" y1="420" x2="340" y2="420" opacity="0.75"/>
    <line x1="234" y1="500" x2="300" y2="500" opacity="0.5"/>
  </g>
  <!-- The "J": a top bar, a stem and a hook. -->
  <path d="M 420 268 L 720 268 M 620 268 L 620 600 A 158 158 0 0 1 304 600"
        fill="none" stroke="url(#mark)" stroke-width="112"
        stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
