[package]
name = "archipel-ide-plugin-hello-wasm"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0 OR MIT"
description = "Example Archipel IDE WASM component plugin (build: cargo xtask build-wasm-example)."
publish = false

# Built for wasm32-wasip2, separately from the host workspace.
[workspace]

[lib]
crate-type = ["cdylib"]

[dependencies]
serde_json = "1"
wit-bindgen = "0.46"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"
