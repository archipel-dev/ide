[package]
name = "mongo-raabit"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false
description = "mongo-raabit: a MongoDB GUI plugin for Archipel IDE (egui views over mongo-raabit-core)"

[dependencies]
mongo-raabit-core = { path = "core" }
archipel-ide-plugin-api = { path = "../../crates/archipel-ide-plugin-api" }
archipel-ide-plugin-ui = { path = "../../crates/archipel-ide-plugin-ui" }
egui.workspace = true
egui_extras = { version = "0.33", default-features = false }
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time"] }
serde.workspace = true
serde_json.workspace = true

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread"] }
eframe.workspace = true
archipel-ide-compat = { path = "../../crates/archipel-ide-compat" }
archipel-ide-ui = { path = "../../crates/archipel-ide-ui" }
