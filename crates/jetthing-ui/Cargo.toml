[package]
name = "jetthing-ui"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
archipel-icons.workspace = true
archipel-kit.workspace = true
eframe.workspace = true
egui.workspace = true
egui_extras = { version = "0.33", default-features = false, features = ["file", "image"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp"] }
jetthing-android = { path = "../jetthing-android" }
jetthing-actions = { path = "../jetthing-actions" }
pulldown-cmark.workspace = true
jetthing-ai = { path = "../jetthing-ai" }
jetthing-bazel = { path = "../jetthing-bazel" }
jetthing-command = { path = "../jetthing-command" }
jetthing-control = { path = "../jetthing-control" }
jetthing-core = { path = "../jetthing-core" }
jetthing-dap = { path = "../jetthing-dap" }
jetthing-git = { path = "../jetthing-git" }
jetthing-keymap = { path = "../jetthing-keymap" }
jetthing-gradle = { path = "../jetthing-gradle" }
jetthing-language = { path = "../jetthing-language" }
jetthing-lsp = { path = "../jetthing-lsp" }
jetthing-markdown = { path = "../jetthing-markdown" }
jetthing-plugins = { path = "../jetthing-plugins" }
jetthing-runner = { path = "../jetthing-runner" }
jetthing-settings = { path = "../jetthing-settings" }
jetthing-split = { path = "../jetthing-split" }
jetthing-templates = { path = "../jetthing-templates" }
jetthing-text = { path = "../jetthing-text" }
jetthing-terminal = { path = "../jetthing-terminal" }
pollster = "0.4"
rfd = { version = "0.17", default-features = false, features = ["xdg-portal"] }
serde.workspace = true
serde_json.workspace = true

[[bench]]
name = "typing"
harness = false

[dev-dependencies]
archipel-kit = { workspace = true, features = ["testing"] }
