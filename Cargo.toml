[workspace]
resolver = "3"
members = [
    "crates/*",
    "plugins/*",
    "plugins/nexus-http/core",
    "plugins/mongo-raabit/core",
    "xtask",
]
# Plugins that are not host crates (manifest-only, Lua, wasm32 guests).
exclude = ["plugins/rust", "plugins/hello-lua", "plugins/hello-wasm"]

[workspace.package]
version = "0.3.1"
edition = "2024"
license = "Apache-2.0 OR MIT"
rust-version = "1.91"

[workspace.dependencies]
# Plugin SDK: source of truth for the command, plugin API and plugin UI crates.
archipel-command = { git = "https://github.com/archipel-dev/sdk", branch = "main" }
archipel-plugin-api = { git = "https://github.com/archipel-dev/sdk", branch = "main" }
archipel-plugin-testing = { git = "https://github.com/archipel-dev/sdk", branch = "main" }
archipel-plugin-ui = { git = "https://github.com/archipel-dev/sdk", branch = "main" }
anyhow = "1.0"
# Shared UI library of the Archipel suite. Pinned to the branch of kit PR #1 until it
# merges into main (then switch `branch` to "main").
archipel-icons = { git = "https://github.com/archipel-dev/kit", branch = "feat/tui-gutter" }
archipel-kit = { git = "https://github.com/archipel-dev/kit", branch = "feat/tui-gutter" }
archipel-kit-tui = { git = "https://github.com/archipel-dev/kit", branch = "feat/tui-gutter" }
archipel-kit-model = { git = "https://github.com/archipel-dev/kit", branch = "feat/tui-gutter" }
eframe = { version = "0.33", features = ["wgpu"] }
egui = "0.33"
lsp-types = "0.95"
parking_lot = "0.12"
portable-pty = "0.9"
pulldown-cmark = { version = "0.13", default-features = false }
quick-xml = "0.37"
ropey = "1.6"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
similar = "2.7"
thiserror = "2.0"
toml = "0.9"
tree-sitter = "0.25"
tree-sitter-bash = "0.25"
tree-sitter-c = "0.24"
tree-sitter-cpp = "0.23"
tree-sitter-css = "0.25"
tree-sitter-go = "0.25"
tree-sitter-groovy = { package = "dekobon-tree-sitter-groovy", version = "0.3" }
tree-sitter-html = "0.23"
tree-sitter-java = "0.23"
tree-sitter-javascript = "0.25"
tree-sitter-json = "0.24"
tree-sitter-kotlin-sg = "0.4"
tree-sitter-language = "0.1"
tree-sitter-md = "0.5"
tree-sitter-properties = "0.3"
tree-sitter-python = "0.25"
tree-sitter-rust = "0.24"
tree-sitter-starlark = "1.3"
tree-sitter-toml-ng = "0.7"
tree-sitter-typescript = "0.23"
tree-sitter-xml = "0.7"
tree-sitter-yaml = "0.7"
url = { version = "2.5", features = ["serde"] }
walkdir = "2.5"
which = "7"


[profile.release]
lto = "thin"
codegen-units = 1
