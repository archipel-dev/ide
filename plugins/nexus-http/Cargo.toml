[package]
name = "nexus-http"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "nexus-http: an Insomnia-class API client plugin for Archipel IDE (egui views over nexus-http-core)."

[dependencies]
egui.workspace = true
archipel-ide-plugin-api = { path = "../../crates/archipel-ide-plugin-api" }
archipel-ide-plugin-ui = { path = "../../crates/archipel-ide-plugin-ui" }
nexus-http-core = { path = "core" }
serde_json = { workspace = true, features = ["preserve_order"] }
url.workspace = true

[dev-dependencies]
archipel-ide-compat = { path = "../../crates/archipel-ide-compat" }
eframe.workspace = true
tempfile = "3"
tiny_http = "0.12"
tungstenite = "0.30"
